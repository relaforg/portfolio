[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
console_error_panic_hook = "0.1.7"
getrandom = { version="0.4.3", features = ["wasm_js"] }
gloo-net = "0.7.0"
js-sys = "0.3.105"
leptos = { version = "0.8.20", features = ["csr"] }
leptos-use = "0.19.2"
leptos_i18n = { version = "0.6.2", features = ["cookie", "csr", "plurals"] }
leptos_meta = "0.8.6"
serde = "1.0.229"


[build-dependencies]
leptos_i18n_build = {version = "0.6.2", features = ["csr"] }
